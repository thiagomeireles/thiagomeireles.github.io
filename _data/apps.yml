# Temas do app "Estatística na prática" (um app Shiny por tema, no Space do Hugging Face)
# Autor: Thiago Meireles | Atualizado: 2026-11-19
# Lido por _includes/busca-apps.html (busca e tags em /aplicativos/ e /en/apps/), por _layouts/apps-topico.html
# (cartões das subpáginas de tópico, que levam à tela cheia), por _layouts/app-tela-cheia.html
# (páginas apps/<slug>/ e apps/en/<slug_en ou slug>/) e por _app_scripts/hf-space/montar_apps.R,
# que monta cada tema no Space. Tema novo: pasta em _app_scripts/apps/ + entrada aqui (com o
# topico, um slug de _data/topicos.yml, e as listas tags e tags_en) + duas páginas de tela cheia em apps/.
# Tags: termos que alguém digitaria para achar o tema, em minúsculas (salvo nomes próprios, como os dos teoremas).

- slug: variaveis
  slug_en: variables
  topico: introducao-estatistica
  titulo: Tipos de variáveis
  title: Types of variables
  descricao: Como classificar uma variável em nominal, ordinal, discreta ou contínua e quais estatísticas fazem sentido para cada tipo, com quiz.
  description: How to classify a variable as nominal, ordinal, discrete or continuous and which statistics make sense for each type, with a quiz.
  tags: [variáveis, qualitativa, quantitativa, nominal, ordinal, discreta, contínua, estatística descritiva, média, mediana, moda, desvio padrão, histograma, boxplot, gráfico de barras, quiz]
  tags_en: [variables, categorical, numerical, nominal, ordinal, discrete, continuous, descriptive statistics, mean, median, mode, standard deviation, histogram, boxplot, bar chart, quiz]
  novo: true

- slug: bidimensional
  slug_en: bivariate
  topico: introducao-estatistica
  titulo: Análise bidimensional
  title: Bivariate analysis
  descricao: Como descrever a relação entre duas variáveis conforme o par de tipos, com tabela de dupla entrada, gráfico de dispersão, box plots e quiz.
  description: How to describe the relationship between two variables depending on the pair of types, with contingency tables, scatterplots, box plots and a quiz.
  tags: [análise bidimensional, duas variáveis, associação, tabela de dupla entrada, tabela de contingência, qui-quadrado, coeficiente de contingência, gráfico de dispersão, covariância, correlação, reta de regressão, box plot, R², gráfico q × q, quiz]
  tags_en: [bivariate analysis, two variables, association, contingency table, cross-tabulation, chi-squared, contingency coefficient, scatterplot, covariance, correlation, regression line, boxplot, R-squared, Q-Q plot, quiz]
  novo: true

- slug: probabilidade
  topico: introducao-estatistica
  titulo: Probabilidade
  title: Probability
  descricao: Distribuição normal padrão (Z) e t de Student, com áreas e valores críticos.
  description: Standard normal (Z) and Student's t distributions, with areas and critical values.
  tags: [probabilidade, distribuição normal, normal padrão, escore z, t de Student, graus de liberdade, valor crítico, nível de confiança, área sob a curva]
  tags_en: [probability, normal distribution, standard normal, z-score, "Student's t", degrees of freedom, critical value, confidence level, area under the curve]

- slug: teoremas-limite
  topico: introducao-estatistica
  titulo: Teoremas limite
