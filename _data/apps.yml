# Apps do "Estatística na prática" (um app Shiny por tópico, no Space do Hugging Face)
# Autor: Thiago Meireles | Atualizado: 2026-11-26
# Lido por _includes/busca-apps.html (busca e tags em /aplicativos/ e /en/apps/), por _layouts/apps-tema.html
# (cartões dos tópicos com app, que levam à tela cheia), por _layouts/app-tela-cheia.html
# (páginas apps/<slug>/ e apps/en/<slug_en ou slug>/) e por _app_scripts/hf-space/montar_apps.R,
# que monta cada app no Space. App novo: pasta em _app_scripts/apps/ + entrada aqui (com o tema,
# um slug de _data/temas.yml, e as listas tags e tags_en) + app: <slug> no tópico em _data/temas.yml
# + duas páginas de tela cheia em apps/.
# publicado: data ("AAAA-MM-DD", entre aspas) em que o app entrou no Space do Hugging Face com link no site.
# atualizado (opcional): data da última atualização que vale anunciar; só conta se vier depois de vencido o "novo".
# O app e o seu tema mostram "novo" ou "atualizado" por apps_novo_dias dias (_config.yml), via _includes/etiqueta-app.html.
# Tags: termos que alguém digitaria para achar o app, em minúsculas (salvo nomes próprios, como os dos teoremas).

