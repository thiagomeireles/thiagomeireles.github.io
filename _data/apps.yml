# Temas do app "Estatística na prática" (um app Shinylive por tema)
# Autor: Thiago Meireles | Atualizado: 2026-11-18
# Usado por aplicativos.md (apps/<slug>/) e en/apps.md (apps/en/<slug_en>/, ou <slug>
# quando não há slug_en), gerados por _app_scripts/shinylive/exportar_apps.R (lista
# `temas` no script, com os mesmos slugs).

- slug: variaveis
  slug_en: variables
  titulo: Tipos de variáveis
  title: Types of variables
  descricao: Nominal, ordinal, discreta ou contínua? Classifique variáveis num quiz e veja quais estatísticas fazem sentido para cada tipo.
  description: Nominal, ordinal, discrete or continuous? Classify variables in a quiz and see which statistics make sense for each type.
  novo: true

- slug: probabilidade
  titulo: Probabilidade
  title: Probability
  descricao: Distribuição normal padrão (Z) e t de Student, com áreas e valores críticos.
  description: Standard normal (Z) and Student's t distributions, with areas and critical values.

- slug: teoremas-limite
  titulo: Teoremas limite
  title: Limit theorems
  descricao: Lei dos Grandes Números e Teorema Central do Limite, com simulações.
  description: Law of Large Numbers and Central Limit Theorem, with simulations.
