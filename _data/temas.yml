# Temas do "Estatística na prática", na ordem de estudo, cada um com seus tópicos
# Autor: Thiago Meireles | Atualizado: 2026-11-26
# Lido por aplicativos.md e en/apps.md (cartões dos temas), por _layouts/apps-tema.html
# (páginas /aplicativos/<slug>/ e /en/apps/<slug_en>/) e por _includes/busca-apps.html.
# Tópico com app: campo app com o slug de _data/apps.yml (o cartão leva à tela cheia).
# Tópico sem app: fica listado como "em breve", sem link.
# Etiquetas "novo" e "atualizado" do tema: automáticas, pelos campos publicado e atualizado dos apps dos tópicos.
# Tema novo: entrada aqui + duas páginas (aplicativos/<slug>.md e en/apps/<slug_en>.md, copiando uma existente).

- slug: descricao-dados
  slug_en: describing-data
  titulo: Descrição de dados
  title: Describing data
  descricao: Como organizar, resumir e representar dados antes de qualquer probabilidade, com uma e com duas variáveis.
  description: How to organize, summarize and display data before any probability, with one and with two variables.
  topicos:
    - titulo: População, amostra, parâmetro e estatística
      title: Population, sample, parameter and statistic
      descricao: O que se quer conhecer, o que de fato se observa e como chamar cada medida.
      description: What we want to know, what we actually observe and what to call each measure.
      app: populacao-amostra
    - titulo: Tipos de variáveis
      title: Types of variables
      app: variaveis
    - titulo: Distribuições de frequência e gráficos
      title: Frequency distributions and graphs
      descricao: Tabela de frequências, gráfico de barras, histograma com densidade e ramo-e-folhas.
      description: Frequency tables, bar charts, density histograms and stem-and-leaf plots.
      app: distribuicoes-frequencia
    - titulo: Medidas de posição e dispersão
      title: Measures of center and spread
      descricao: Média, mediana, quantis, variância, desvio padrão, box plot e escore z.
      description: Mean, median, quantiles, variance, standard deviation, box plot and z-score.
      app: posicao-dispersao
    - titulo: Análise bidimensional
      title: Bivariate analysis
      app: bidimensional

- slug: probabilidade
  slug_en: probability
  titulo: Probabilidade
  title: Probability
  descricao: Como atribuir e calcular probabilidades, do espaço amostral ao teorema de Bayes.
  description: How to assign and calculate probabilities, from the sample space to Bayes' theorem.
  topicos:
    - titulo: Espaço amostral, eventos e axiomas
      title: Sample space, events and axioms
      descricao: Experimento aleatório, eventos, axiomas da probabilidade e técnicas de contagem.
      description: Random experiments, events, probability axioms and counting techniques.
      app: espaco-amostral
    - titulo: Probabilidade condicional e Bayes
      title: Conditional probability and Bayes
      descricao: Condicional, independência, árvores, probabilidade total e teorema de Bayes.
      description: Conditioning, independence, tree diagrams, total probability and Bayes' theorem.
      app: condicional-bayes

- slug: variaveis-aleatorias
  slug_en: random-variables
  titulo: Variáveis aleatórias e modelos
  title: Random variables and models
  descricao: Os modelos de probabilidade mais usados, discretos e contínuos, com esperança e variância, e o comportamento conjunto de duas variáveis.
  description: The most widely used probability models, discrete and continuous, with expected value and variance, and how two random variables behave together.
  topicos:
    - titulo: Variáveis aleatórias discretas
      title: Discrete random variables
      descricao: Função de probabilidade, esperança, variância e os modelos Bernoulli, binomial e Poisson.
      description: Probability mass function, expected value, variance and the Bernoulli, binomial and Poisson models.
      app: va-discretas
    - titulo: Variáveis aleatórias contínuas e a normal
      title: Continuous random variables and the normal
      descricao: Densidade, função de distribuição, uniforme, exponencial e normal. O app atual cobre a normal padrão.
      description: Density, distribution function, uniform, exponential and normal. The current app covers the standard normal.
      app: probabilidade
    - titulo: Duas variáveis aleatórias
      title: Two random variables
      descricao: Distribuição conjunta, marginais, covariância e correlação.
      description: Joint distribution, marginals, covariance and correlation.
      app: duas-va

- slug: amostra-populacao
  slug_en: sample-to-population
  titulo: Distribuições amostrais
  title: Sampling distributions
  descricao: Por que uma amostra diz algo sobre a população e como as estatísticas variam de amostra para amostra.
  description: Why a sample tells us something about the population and how statistics vary from sample to sample.
  topicos:
    - titulo: Amostragem
      title: Sampling
      descricao: Amostra aleatória simples com e sem reposição e a estatística como variável aleatória.
      description: Simple random sampling with and without replacement, and the statistic as a random variable.
      app: amostragem
    - titulo: Teoremas limite
      title: Limit theorems
      app: teoremas-limite
    - titulo: Qui-quadrado, t de Student e F
      title: Chi-squared, Student's t and F
      descricao: As distribuições que nascem da normal e aparecem na inferência. O app atual cobre a t de Student.
      description: The distributions derived from the normal that show up in inference. The current app covers Student's t.
      app: probabilidade
    - titulo: Simulação e bootstrap
      title: Simulation and bootstrap
      descricao: Números pseudoaleatórios, transformação inversa, Monte Carlo e reamostragem bootstrap.
      description: Pseudorandom numbers, inverse transform, Monte Carlo and bootstrap resampling.

- slug: inferencia
  slug_en: inference
  titulo: Inferência
  title: Inference
  descricao: Estimar e testar com base na amostra, de uma média a uma reta de regressão.
  description: Estimating and testing from a sample, from a single mean to a regression line.
  topicos:
    - titulo: Estimação e intervalos de confiança
      title: Estimation and confidence intervals
      descricao: Estimadores, erro padrão e intervalos de confiança para média e proporção.
      description: Estimators, standard error and confidence intervals for a mean and a proportion.
      app: estimacao-ic
    - titulo: Testes de hipóteses
      title: Hypothesis testing
      descricao: Erros tipo I e II, poder e valor-p.
      description: Type I and II errors, power and p-values.
      app: testes-hipoteses
    - titulo: Comparação de duas populações
      title: Comparing two populations
      descricao: Médias com amostras independentes e pareadas, variâncias e proporções.
      description: Means with independent and paired samples, variances and proportions.
      app: duas-populacoes
    - titulo: Qui-quadrado de aderência e independência
      title: Chi-squared goodness of fit and independence
      descricao: Se os dados seguem um modelo e se duas variáveis categóricas estão associadas.
      description: Whether data follow a model and whether two categorical variables are associated.
      app: qui-quadrado
    - titulo: Análise de variância
      title: Analysis of variance
      descricao: Comparação de várias médias com a ANOVA de um fator.
      description: Comparing several means with one-way ANOVA.
      app: anova
    - titulo: Regressão linear simples
      title: Simple linear regression
      descricao: Mínimos quadrados, R², intervalos para a reta e análise de resíduos.
      description: Least squares, R², intervals for the line and residual analysis.
      app: regressao-simples


- slug: regressao-series
  slug_en: regression-time-series
  titulo: Regressão avançada e séries
  title: Advanced regression and time series
  descricao: Extensões do modelo linear para múltiplas variáveis explicativas, respostas categóricas ou de contagem e dados ao longo do tempo.
  description: Extensions of the linear model to multiple covariates, categorical or count outcomes and data over time.
  topicos:
    - titulo: Regressão linear múltipla
      title: Multiple linear regression
      descricao: Efeitos parciais, viés de variável omitida, multicolinearidade e testes F conjuntos.
      description: Partial effects, omitted variable bias, multicollinearity and joint F tests.
    - titulo: Regressão logística, Poisson e GLMs
      title: Logistic regression, Poisson and GLMs
      descricao: Modelos para resposta binária (Logit e Probit), razões de chances e contagens.
      description: Models for binary outcomes (Logit and Probit), odds ratios and count data.
    - titulo: Séries temporais e autocorrelação
      title: Time series and autocorrelation
      descricao: Tendência, sazonalidade, passeio aleatório, regressão espúria e correlação serial.
      description: Trend, seasonality, random walk, spurious regression and serial correlation.

- slug: inferencia-causal
  slug_en: causal-inference
  titulo: Inferência causal
  title: Causal inference
  descricao: Estratégias de identificação para distinguir associação de efeito causal em dados experimentais e observacionais.
  description: Identification strategies to separate association from causal effects in experimental and observational data.
  topicos:
    - titulo: DAGs, confundidores e colisores
      title: DAGs, confounders and colliders
      descricao: Grafos causais, controles bons e ruins, viés de colisor e critério back-door.
      description: Causal graphs, good and bad controls, collider bias and the back-door criterion.
    - titulo: Experimentos aleatorizados (RCTs)
      title: Randomized experiments (RCTs)
      descricao: Resultados potenciais, efeito médio de tratamento, blocos e inferência exata de Fisher.
      description: Potential outcomes, average treatment effect, blocking and Fisher exact inference.
    - titulo: Pareamento, IPW e estimadores duplamente robustos
      title: Matching, IPW and doubly robust estimators
      descricao: Escore de propensão, sobreposição, ponderação inversa e estimação AIPW.
      description: Propensity score, overlap, inverse probability weighting and AIPW estimation.
    - titulo: Diferenças em diferenças e dados em painel
      title: Difference-in-differences and panel data
      descricao: Tendências paralelas, efeitos fixos, estudo de eventos e erros-padrão clusterizados.
      description: Parallel trends, fixed effects, event studies and clustered standard errors.
    - titulo: Variáveis instrumentais (2SLS)
      title: Instrumental variables (2SLS)
      descricao: Relevância, restrição de exclusão, instrumento fraco e efeito local (LATE).
      description: Relevance, exclusion restriction, weak instruments and local average treatment effect (LATE).
    - titulo: Regressão com descontinuidade e controle sintético
      title: Regression discontinuity and synthetic control
      descricao: Desenhos sharp e fuzzy, escolha de janela e placebos em estudos de caso comparativos.
      description: Sharp and fuzzy designs, bandwidth selection and placebos in comparative case studies.

- slug: estatistica-bayesiana
  slug_en: bayesian-statistics
  titulo: Estatística bayesiana
  title: Bayesian statistics
  descricao: Modelagem probabilística completa, computação via MCMC, estrutura hierárquica e avaliação preditiva de modelos.
  description: Full probability modeling, MCMC computation, hierarchical structure and predictive model evaluation.
  topicos:
    - titulo: Modelos multiparamétricos e prioris
      title: Multiparameter models and priors
      descricao: Prioris fracamente informativas, conjugadas e análise de sensibilidade.
      description: Weakly informative priors, conjugate families and sensitivity analysis.
    - titulo: Computação bayesiana e MCMC
      title: Bayesian computation and MCMC
      descricao: Aproximação em grade, Metropolis-Hastings, HMC e diagnósticos de convergência.
      description: Grid approximation, Metropolis-Hastings, HMC and convergence diagnostics.
    - titulo: Modelos hierárquicos
      title: Hierarchical models
      descricao: Agrupamento parcial (partial pooling), interceptos e inclinações variáveis.
      description: Partial pooling, varying intercepts and varying slopes.
    - titulo: Checagem preditiva, WAIC/LOO e dados faltantes
      title: Predictive checking, WAIC/LOO and missing data
      descricao: Replicações preditivas a posteriori, comparação de modelos e imputação múltipla.
      description: Posterior predictive checks, model comparison and multiple imputation.

- slug: ml-causal
  slug_en: causal-ml
  titulo: Aprendizado de máquina e causalidade
  title: Machine learning and causality
  descricao: Regularização, métodos baseados em árvores e estimação de efeitos heterogêneos com aprendizado de máquina.
  description: Regularization, tree-based methods and heterogeneous treatment effect estimation with machine learning.
  topicos:
    - titulo: Viés–variância, regularização e validação cruzada
      title: Bias–variance, regularization and cross-validation
      descricao: Sobreajuste, Ridge, Lasso, Elastic Net e seleção de hiperparâmetros.
      description: Overfitting, Ridge, Lasso, Elastic Net and hyperparameter tuning.
    - titulo: Árvores, Random Forest e Boosting
      title: Trees, Random Forest and Boosting
      descricao: Particionamento recursivo (CART), bagging e gradient boosting.
      description: Recursive partitioning (CART), bagging and gradient boosting.
    - titulo: Double Machine Learning e efeitos heterogêneos
      title: Double Machine Learning and heterogeneous effects
      descricao: Ortogonalização de Neyman, Meta-Learners e Florestas Causais.
      description: Neyman orthogonalization, Meta-Learners and Causal Forests.
