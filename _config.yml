title: "Thiago Meireles"
description: "Site em construção"
url: "https://www.thiagomeireles.com.br"
baseurl: ""

# --- AQUI ESTÁ O TRUQUE ---
# Usamos a versão v0.14.0 para funcionar no GitHub Pages padrão
remote_theme: chrisrhymes/bulma-clean-theme@v0.14.0

# Plugins necessários para esse tema funcionar bem
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# Configuração da Paginação (para o blog)
paginate: 5
paginate_path: "/blog/page:num/"

# Configuraçõe do Menu (Bulma Clean precisa disso)
#hero_image: /assets/images/hero.jpg # Opcional: imagem de fundo do topo
show_sidebar: true # Se quer barra lateral

# Autor Padrão do site
author: "Thiago Meireles"

# Aplica o autor padrão a todos os posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      author: "Thiago Meireles"

# --- COMENTÁRIOS COM GISCUS ---
# Passo 1: Habilite Discussions no repositório GitHub
# Passo 2: Acesse https://giscus.app, configure e copie os IDs abaixo
giscus:
  repo: "thiagomeireles/thiagomeireles.github.io"
  repo_id: "R_kgDOQ1mjhw"
  category: "Announcements"
  category_id: "DIC_kwDOQ1mjh84C7mi2"
  theme: "light"
  lang: "pt"
