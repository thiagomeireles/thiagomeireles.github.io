<!doctype html>
<!--
=============================================================================
Página:  diagnostico-ios/index.html (diagnóstico do service worker do Shinylive)
Autor:  Thiago Meireles
Atualizado: 2026-11-19

Entrada:
  - ../shinylive-sw.js (o mesmo service worker usado pelos apps)
Saída:
  - resultado dos testes na tela, para captura de tela no celular
Uso: abrir https://thiagomeireles.com.br/apps/diagnostico-ios/ no iPhone.
Não é gerada pelo exportar_apps.R; remover quando o problema do iOS 27 for resolvido.
=============================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Thiago Meireles">
  <meta name="robots" content="noindex">
  <title>Diagnóstico Shinylive (iOS)</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #212529; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    p.info { font-size: 0.85rem; color: #6c757d; margin: 0 0 12px; word-break: break-word; }
    ol { padding-left: 1.2rem; margin: 0; }
    li { margin: 0 0 10px; font-size: 0.95rem; }
    li .det { display: block; font-size: 0.8rem; color: #495057; word-break: break-word; }
    .ok { color: #198754; font-weight: 600; }
    .falha { color: #dc3545; font-weight: 600; }
    .esperando { color: #6c757d; }
    #resumo { margin-top: 14px; padding: 10px; border-radius: 8px; background: #f1f3f5; font-size: 0.9rem; }
    button { margin-top: 12px; font-size: 1rem; padding: 8px 14px; }
    iframe { width: 1px; height: 1px; border: 0; position: absolute; left: -10px; }
  </style>
</head>
<body>
  <h1>Diagnóstico do Shinylive</h1>
  <p class="info" id="ambiente"></p>
  <ol id="lista"></ol>
  <div id="resumo">Rodando os testes…</div>
  <button id="repetir" type="button">Rodar de novo</button>

  <script>
    var lista = document.getElementById("lista");
    var resumo = [];
    var APP = "app_diagnostico" + Math.random().toString(36).slice(2, 10) + "/";
    var BASE = new URL(APP, location.href).href;

    document.getElementById("ambiente").textContent =
      navigator.userAgent + " | contexto seguro: " + window.isSecureContext;

    document.getElementById("repetir").addEventListener("click", function () {
      try { sessionStorage.removeItem("diag_recarregou"); } catch (e) {}
      location.reload();
    });

    function item(nome) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="esperando">⏳ ' + nome + "</span><span class='det'></span>";
      lista.appendChild(li);
      return {
        fim: function (ok, detalhe) {
          li.firstChild.className = ok ? "ok" : "falha";
          li.firstChild.textContent = (ok ? "✅ " : "❌ ") + nome;
          li.lastChild.textContent = detalhe || "";
          resumo.push((ok ? "OK " : "FALHA ") + nome + (detalhe ? " (" + detalhe + ")" : ""));
        }
      };
    }

    function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function comPrazo(promessa, ms, mensagem) {
      return Promise.race([promessa, esperar(ms).then(function () { throw new Error(mensagem); })]);
    }

    // Responde aos pedidos que o service worker repassa à página (protocolo ASGI do Shinylive)
    function responder(porta, status, tipo, corpo) {
      porta.postMessage({ type: "http.response.start", status: status, headers: [["content-type", tipo]] });
      porta.postMessage({ type: "http.response.body", body: new TextEncoder().encode(corpo), more_body: false });
    }

    var respostas = {
      "/": ["text/html; charset=utf-8", "<!doctype html><html><head><title>diag</title></head><body><p id='m'>NAVEGACAO-VIA-SW</p></body></html>"],
      "/teste.txt": ["text/plain", "FETCH-VIA-SW"],
      "/script.js": ["text/javascript", "window.parent.postMessage({ diag: 'script-ok' }, '*');"]
    };

    function configurarProxy(controller) {
      var canal = new MessageChannel();
      canal.port1.addEventListener("message", function (e) {
        if (e.data.type !== "makeRequest") return;
        var porta = e.ports[0];
        var caminho = e.data.scope.path;
        porta.addEventListener("message", function (m) {
          if (m.data.type === "http.request" && !m.data.more_body) {
            var r = respostas[caminho];
            if (r) responder(porta, 200, r[0], r[1]);
            else responder(porta, 404, "text/plain", "nao encontrado no diagnostico: " + caminho);
          }
        });
        porta.start();
      });
      canal.port1.start();
      controller.postMessage({ type: "configureProxyPath", path: APP }, [canal.port2]);
    }

    async function testar() {
      // 1. Registro do service worker (mesmo arquivo e tipo usados pelos apps)
      var t1 = item("Service worker registrado");
      if (!("serviceWorker" in navigator)) { t1.fim(false, "navegador sem navigator.serviceWorker"); return concluir(); }
      try {
        var reg = await navigator.serviceWorker.register("../shinylive-sw.js", { type: "module" });
        await comPrazo(navigator.serviceWorker.ready, 10000, "ready não resolveu em 10 s");
        t1.fim(true, "escopo " + reg.scope + " | estado " + (reg.active && reg.active.state));
      } catch (e) {
        t1.fim(false, String(e && e.message || e));
        return concluir();
      }

      // 2. A página está sob controle do service worker?
      var t2 = item("Página controlada pelo service worker");
      if (!navigator.serviceWorker.controller) {
        var recarregou = false;
        try { recarregou = sessionStorage.getItem("diag_recarregou") === "1"; } catch (e) {}
        if (!recarregou) {
          try { sessionStorage.setItem("diag_recarregou", "1"); } catch (e) {}
          location.reload();
          return;
        }
        t2.fim(false, "sem controller mesmo depois de recarregar");
        return concluir();
      }
      t2.fim(true, navigator.serviceWorker.controller.scriptURL);
      try { sessionStorage.removeItem("diag_recarregou"); } catch (e) {}

      configurarProxy(navigator.serviceWorker.controller);
      await esperar(300);

      // 3. fetch() da própria página para o caminho do app
      var t3 = item("fetch() da página passa pelo service worker");
      try {
        var resp = await comPrazo(fetch(APP + "teste.txt", { cache: "no-store" }), 10000, "sem resposta em 10 s");
        var texto = await resp.text();
        t3.fim(texto === "FETCH-VIA-SW", "status " + resp.status + ": " + texto.slice(0, 80));
      } catch (e) {
        t3.fim(false, String(e && e.message || e));
      }

      // 4. Navegação de um iframe para o caminho do app (o que o Shinylive faz)
      var t4 = item("Navegação do iframe passa pelo service worker");
      await new Promise(function (pronto) {
        var quadro = document.createElement("iframe");
        var encerrado = false;
        function encerrar(ok, detalhe) { if (encerrado) return; encerrado = true; t4.fim(ok, detalhe); pronto(); }
        quadro.addEventListener("load", function () {
          try {
            // Ignora o about:blank inicial; só vale a navegação para o caminho do app
            if (quadro.contentWindow.location.href.indexOf(APP) < 0) return;
            var corpo = quadro.contentDocument.body ? quadro.contentDocument.body.innerText : "";
            encerrar(corpo.indexOf("NAVEGACAO-VIA-SW") >= 0, corpo.replace(/\s+/g, " ").slice(0, 80));
          } catch (e) {
            encerrar(false, "sem acesso ao iframe: " + e.message);
          }
        });
        setTimeout(function () { encerrar(false, "iframe não carregou em 15 s"); }, 15000);
        quadro.src = APP;
        document.body.appendChild(quadro);
      });

      // 5 e 6. Contorno: iframe vazio com HTML escrito pela página; script e fetch
      // internos. No Chrome falham (o iframe não herda o service worker); o que
      // interessa é o resultado no iOS.
      var t5 = item("Contorno: iframe escrito pela página carrega script via service worker");
      var t6 = item("Contorno: fetch() de dentro desse iframe passa pelo service worker");
      await new Promise(function (pronto) {
        var resultados = { script: null, fetch: null };
        var encerrado = false;
        function encerrar() {
          if (encerrado) return; encerrado = true;
          t5.fim(resultados.script === true, resultados.script === true ? "script executou" : "script não executou em 15 s");
          t6.fim(resultados.fetch === "FETCH-VIA-SW", resultados.fetch === null ? "sem resposta em 15 s" : String(resultados.fetch).slice(0, 80));
          pronto();
        }
        window.addEventListener("message", function (e) {
          if (!e.data || !e.data.diag) return;
          if (e.data.diag === "script-ok") resultados.script = true;
          if (e.data.diag === "fetch") resultados.fetch = e.data.texto;
          if (resultados.script !== null && resultados.fetch !== null) encerrar();
        });
        setTimeout(encerrar, 15000);
        var quadro = document.createElement("iframe");
        document.body.appendChild(quadro);
        var doc = quadro.contentDocument;
        doc.open();
        doc.write(
          "<!doctype html><html><head><base href='" + BASE + "'>" +
          "<script src='script.js'><\/script>" +
          "<script>fetch('teste.txt', { cache: 'no-store' }).then(function (r) { return r.text().then(function (t) { return r.status + ': ' + t; }); })" +
          ".then(function (t) { parent.postMessage({ diag: 'fetch', texto: t.indexOf('FETCH-VIA-SW') >= 0 ? 'FETCH-VIA-SW' : t }, '*'); })" +
          ".catch(function (e) { parent.postMessage({ diag: 'fetch', texto: 'erro: ' + e.message }, '*'); });<\/script>" +
          "</head><body></body></html>"
        );
        doc.close();
      });

      concluir();
    }

    function concluir() {
      document.getElementById("resumo").textContent =
        "Resumo (envie uma captura desta tela): " + (resumo.length ? resumo.join(" | ") : "nenhum teste concluído");
    }

    testar();
  </script>
</body>
</html>
