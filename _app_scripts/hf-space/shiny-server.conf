# Shiny Server do Space "estatistica-na-pratica"
# Autor: Thiago Meireles | Atualizado: 2026-11-19
#
# Cada pasta com app.R em /srv/shiny-server vira um app, com processo R próprio.
# Roda como "user" (UID 1000), o usuário que o Hugging Face usa no container.

run_as user;

server {
  # Porta que o Hugging Face expõe (app_port no README.md)
  listen 7860;

  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index off;

    # Primeira carga de um app inclui ggplot2 e bslib
    app_init_timeout 120;
    # Mantém o processo R vivo 30 min depois da última sessão: quem abre logo
    # em seguida não espera o R subir de novo
    app_idle_timeout 1800;
  }
}
